<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>GrindChat</title> <!-- FIXED TITLE -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    body { background-color: #0D0D0D; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .loader { text-align: center; font-family: sans-serif; }
    .g-logo { width: 80px; height: 80px; background: linear-gradient(135deg, #8E2DE2, #4A00E0); border-radius: 20px; display: flex; justify-content: center; align-items: center; color: white; font-size: 42px; font-weight: bold; margin-bottom: 20px; box-shadow: 0 0 25px rgba(142, 45, 226, 0.5); }
    .spin { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #00D2FF; border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto; }
    @keyframes s { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="g-logo">G</div>
    <div class="spin"></div>
    <p style="color: #444; font-size: 10px; letter-spacing: 2px; margin-top: 15px;">GRINDING...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
